          }
        }
      }
    },
    "/auth/devices/approve": {
      "post": {
        "operationId": "approveDeviceEnrollment",
        "summary": "Bind a pending enrollment to the authenticated user",
        "description": "The approving user types the PIN shown on the device; the code is normalized server-side (case and separators). The claim is a single conditional UPDATE: a second presentation of the same code loses. Audited as device_enrollment_approved.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
