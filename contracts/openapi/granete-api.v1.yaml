          }
        }
      }
    },
    "/auth/devices/enroll/poll": {
      "post": {
        "operationId": "pollDeviceEnrollment",
        "summary": "Poll the enrollment status by its id",
        "description": "The enrolling device polls by the id returned by enroll. Knowing the id is the only capability: RLS scopes the read to exactly that row. Returns pending/approved/exchanged/expired; expired is derived server-side from expires_at while the row stays pending.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DeviceEnrollPollRequest"
