        "summary": "Re-mint the SketchUp transport token from the device secret",
        "description": "Wrong secret, unknown device, revoked device and inactive user all answer the same 401 (no oracle). The bearer carries the registry session id and is capped by the session's absolute expiry; revoking the device (or the session) cuts access on the next request. The session scope mirrors login's single-membership auto-selection.",
