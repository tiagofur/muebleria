    "/auth/login": {
      "post": {
        "operationId": "login",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authenticated or organization selection required",
            "headers": {
              "Set-Cookie": {
                "description": "Web transport only (#460 SEC-4A): granete_web_refresh=<opaque first refresh credential>; HttpOnly; SameSite=Strict; Path=/api/auth; Secure (production); expires at the session absolute bound. Mobile receives its opaque credential in the body instead; sketchup/support receive none.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/auth/refresh": {
      "post": {
        "operationId": "refreshSession",
        "summary": "Rotate the refresh credential (transport-dispatched)",
        "description": "#460 SEC-4A credential transport contract. Mobile: POST the JSON body {refresh_token, transport:\"mobile\"} and receive the rotated credential in the body. Web: POST with no body; the HttpOnly granete_web_refresh cookie carries the credential, the request must send an exactly-allowed Origin plus the X-Granete-CSRF: 1 header (403 otherwise), and the rotated credential returns only as a fresh Set-Cookie bounded by the session's ORIGINAL absolute expiry. SketchUp/support (compatibility bridge until SEC-6): POST with no body and the Authorization bearer. A JSON body together with the web cookie is rejected as credential mixing.",
        "responses": {
          "200": {
            "description": "Rotated access credential; rotated refresh credential via body (mobile) or Set-Cookie (web)",
            "headers": {
              "Set-Cookie": {
                "description": "Web transport only: granete_web_refresh=<opaque>; HttpOnly; SameSite=Strict; Path=/api/auth; Secure (production); expires at the session's absolute bound. Never present for mobile/sketchup transports.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        },
        "security": [],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RefreshRequest"
              }
            }
          }
        }
      }
    },
    "/auth/logout": {
      "post": {
        "operationId": "logoutSession",
        "summary": "Revoke the session behind the presented refresh credential",
        "description": "#460 SEC-4A: mobile POSTs {refresh_token} in the JSON body; web POSTs with no body, the HttpOnly granete_web_refresh cookie, an exactly-allowed Origin and the X-Granete-CSRF: 1 header. Both are enumeration-safe and idempotent; the web flow always clears the cookie with matching attributes.",
        "security": [],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LogoutRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Session is no longer usable",
            "headers": {
              "Set-Cookie": {
                "description": "Web transport only: granete_web_refresh deleted (Max-Age=0, same Path).",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LogoutResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
