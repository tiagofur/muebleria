    "/auth/devices/enroll": {
      "post": {
        "operationId": "enrollDevice",
        "summary": "Start a device enrollment (SketchUp, #460 SEC-6)",
        "description": "Anonymous, rate-limited entry point of the OAuth-device-grant-shaped flow. Returns the enrollment id (a capability shown only to the enrolling device) and the 6-character PIN the user types in the web console. Codes expire after 10 minutes.",
