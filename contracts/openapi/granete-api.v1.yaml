{
  "openapi": "3.1.0",
  "info": {
    "title": "Granete Organization Foundation API",
    "version": "1.0.0"
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "paths": {
    "/auth/login": {
      "post": {
        "operationId": "login",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authenticated or organization selection required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/auth/refresh": {
      "post": {
        "operationId": "refreshSession",
        "responses": {
          "200": {
            "description": "Refreshed session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/auth/select-org": {
      "post": {
        "operationId": "selectOrganization",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SelectOrganizationRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Organization-scoped session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/auth/me": {
      "get": {
        "operationId": "getSession",
        "responses": {
          "200": {
            "description": "Current session",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MeResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/auth/accept-invitation": {
      "post": {
        "operationId": "acceptInvitation",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AcceptInvitationRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Invitation accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/org/team": {
      "get": {
        "operationId": "listTeam",
        "responses": {
          "200": {
            "description": "Team",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/TeamMember"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/org/members/{userId}/roles": {
      "put": {
        "operationId": "updateMemberRoles",
        "parameters": [
          {
            "$ref": "#/components/parameters/UserId"
          },
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateMemberRolesRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated membership",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MembershipMutationResponse"
                }
              }
            }
          },
          "412": {
            "$ref": "#/components/responses/ApiError"
          },
          "428": {
            "$ref": "#/components/responses/ApiError"
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/org/members/{userId}/active": {
      "put": {
        "operationId": "updateMemberActive",
        "parameters": [
          {
            "$ref": "#/components/parameters/UserId"
          },
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateMemberActiveRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated membership",
            "headers": {
              "ETag": {
                "$ref": "#/components/headers/ETag"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MembershipMutationResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/org/invitations": {
      "get": {
        "operationId": "listInvitations",
        "responses": {
          "200": {
            "description": "Invitations",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Invitation"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      },
      "post": {
        "operationId": "createInvitation",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateInvitationRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Invitation created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CreateInvitationResponse"
                }
              }
            }
          },
          "409": {
            "$ref": "#/components/responses/ApiError"
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/platform/organizations": {
      "get": {
        "operationId": "listPlatformOrganizations",
        "responses": {
          "200": {
            "description": "Organizations",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/PlatformOrganization"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      },
      "post": {
        "operationId": "createPlatformOrganization",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreatePlatformOrganizationRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Organization created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlatformOrganization"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/platform/users": {
      "get": {
        "operationId": "listPlatformUsers",
        "responses": {
          "200": {
            "description": "Global users",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/PlatformUser"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/platform/organizations/{id}/audit": {
      "get": {
        "operationId": "listSecurityAudit",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Audit events",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/SecurityAuditEvent"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/organization-relationships": {
      "get": {
        "operationId": "listOrganizationRelationships",
        "x-future-owner": "#453",
        "responses": {
          "200": {
            "description": "Authorized relationships",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/OrganizationRelationship"
                  }
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/sales-network": {
      "get": {
        "operationId": "getSalesNetwork",
        "x-future-owner": "#459",
        "responses": {
          "200": {
            "description": "Sales-network read model",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SalesNetworkReadModel"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/auth/register": {
      "post": {
        "operationId": "register",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RegisterRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Registration requested",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RegisterResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/org/invitations/{id}": {
      "delete": {
        "operationId": "revokeInvitation",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Invitation revoked",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RevokeInvitationResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/platform/organizations/{id}": {
      "patch": {
        "operationId": "updatePlatformOrganization",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "$ref": "#/components/parameters/IfMatch"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdatePlatformOrganizationRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Organization updated",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PlatformOrganization"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/platform/organizations/{id}/support-session": {
      "post": {
        "operationId": "startSupportSession",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StartSupportSessionRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Support session started",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SupportSessionResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/platform/support-sessions/{sessionId}": {
      "delete": {
        "operationId": "endSupportSession",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Support session ended",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EndSupportSessionResponse"
                }
              }
            }
          },
          "default": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "UserId": {
        "name": "userId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "IfMatch": {
        "name": "If-Match",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "pattern": "^\\\"v[1-9][0-9]*\\\"$"
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string",
          "minLength": 16,
          "maxLength": 128,
          "pattern": "^[A-Za-z0-9._:-]+$"
        }
      }
    },
    "headers": {
      "ETag": {
        "description": "Strong resource version",
        "schema": {
          "type": "string",
          "pattern": "^\\\"v[1-9][0-9]*\\\"$"
        }
      }
    },
    "responses": {
      "ApiError": {
        "description": "Structured API error",
        "headers": {
          "X-Request-ID": {
            "schema": {
              "type": "string"
            }
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ApiError"
            }
          }
        }
      }
    },
    "schemas": {
      "ApiErrorCode": {
        "type": "string",
        "enum": [
          "BAD_REQUEST",
          "UNAUTHORIZED",
          "FORBIDDEN",
          "NOT_FOUND",
          "METHOD_NOT_ALLOWED",
          "VERSION_CONFLICT",
          "CONFLICT",
          "INTERNAL_ERROR",
          "PRECONDITION_REQUIRED",
          "MEMBERSHIP_NOT_FOUND",
          "MEMBERSHIP_VERSION_CONFLICT",
          "ROLE_NOT_ALLOWED",
          "LAST_ADMIN",
          "SEAT_LIMIT_REACHED",
          "INVITATION_EXPIRED",
          "INVITATION_ALREADY_USED",
          "ORGANIZATION_PROVISIONING",
          "RELATIONSHIP_NOT_ACTIVE",
          "FACTORY_NOT_AUTHORIZED",
          "CATALOG_VERSION_UNAVAILABLE",
          "IDEMPOTENCY_CONFLICT"
        ]
      },
      "ApiError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message",
          "fieldErrors",
          "requestId",
          "retryable",
          "details"
        ],
        "properties": {
          "code": {
            "$ref": "#/components/schemas/ApiErrorCode"
          },
          "message": {
            "type": "string"
          },
          "fieldErrors": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "requestId": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        }
      },
      "AuthTransport": {
        "type": "string",
        "enum": [
          "web",
          "mobile",
          "sketchup",
          "support"
        ]
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "email",
          "name",
          "active",
          "platform_admin"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "active": {
            "type": "boolean"
          },
          "platform_admin": {
            "type": "boolean"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "updated_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "License": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "plan",
          "status"
        ],
        "properties": {
          "plan": {
            "type": "string"
          },
          "expires_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time"
          },
          "status": {
            "type": "string"
          }
        }
      },
      "OrganizationSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "name",
          "slug",
          "type",
          "license"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "slug": {
            "type": "string"
          },
          "type": {
            "type": "string",
            "enum": [
              "factory",
              "store",
              "dealer"
            ]
          },
          "license": {
            "$ref": "#/components/schemas/License"
          }
        }
      },
      "Membership": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "organization_id",
          "roles",
          "organization",
          "version"
        ],
        "properties": {
          "organization_id": {
            "type": "string"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "organization": {
            "$ref": "#/components/schemas/OrganizationSummary"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "transport": {
            "$ref": "#/components/schemas/AuthTransport"
          },
          "client": {
            "type": "string"
          },
          "org": {
            "type": "string"
          }
        }
      },
      "SelectOrganizationRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "organization_id"
        ],
        "properties": {
          "organization_id": {
            "type": "string"
          }
        }
      },
      "AcceptInvitationRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "password"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "password": {
            "type": "string"
          },
          "name": {
            "type": "string"
          }
        }
      },
      "LoginResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "user",
          "license",
          "transport",
          "token",
          "roles",
          "memberships",
          "selection_required"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "license": {
            "$ref": "#/components/schemas/License"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "organization": {
            "$ref": "#/components/schemas/OrganizationSummary"
          },
          "memberships": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Membership"
            }
          },
          "selection_required": {
            "type": "boolean"
          },
          "support": {
            "type": "boolean"
          },
          "transport": {
            "$ref": "#/components/schemas/AuthTransport"
          }
        }
      },
      "SupportInfo": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "organization_id",
          "session_id",
          "reason"
        ],
        "properties": {
          "organization_id": {
            "type": "string"
          },
          "session_id": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "MeResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "user",
          "roles",
          "transport"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "organization": {
            "$ref": "#/components/schemas/OrganizationSummary"
          },
          "support": {
            "$ref": "#/components/schemas/SupportInfo"
          },
          "transport": {
            "$ref": "#/components/schemas/AuthTransport"
          }
        }
      },
      "TeamMember": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "user_id",
          "email",
          "name",
          "active",
          "roles",
          "member_since",
          "version"
        ],
        "properties": {
          "user_id": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "active": {
            "type": "boolean"
          },
          "roles": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "member_since": {
            "type": "string",
            "format": "date-time"
