        "description": "The current TOTP is verified against the pending factor's sealed secret; the pending→enabled transition, the accepted counter (replay high-water mark) and the recovery-code batch commit in one transaction. The recovery codes' plaintext exists only in this response. An expired or already-verified enrollment answers MFA_ENROLLMENT_EXPIRED / MFA_FACTOR_NOT_FOUND.",
