    "/auth/mfa/totp:begin": {
      "post": {
        "operationId": "beginMFAEnrollment",
        "summary": "Start a TOTP enrollment",
        "description": "Generates a sealed 160-bit secret and returns the otpauth:// provisioning URI exactly ONCE; it is never logged, persisted or re-shown. The factor is pending and authorizes nothing until verified with a live TOTP. Any previous pending enrollment is revoked in the same transaction. Pending enrollments expire and can never be enabled afterwards.",
        "requestBody": {
          "required": true,
          "content": {
