    "/auth/devices/exchange": {
      "post": {
        "operationId": "exchangeDeviceEnrollment",
        "summary": "Consume the approved enrollment for the device secret",
        "description": "Single-use: the approved→exchanged transition, the hash-only device credential and its registry session (client_type sketchup, 30-day absolute bound) commit in one transaction. The raw secret exists only in this response; the database stores sha256 only.",
