name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ledger:
    name: Validate Feature List & Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate feature_list.json
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              data = json.load(open("feature_list.json"))
              valid = {"pending", "in_progress", "done", "blocked"}
              in_progress = [f for f in data["features"] if f["status"] == "in_progress"]
              if len(in_progress) > 1:
                  print(f"[FAIL] Hay {len(in_progress)} features en in_progress (máximo 1)")
                  sys.exit(1)
              for f in data["features"]:
                  if f["status"] not in valid:
                      print(f"[FAIL] Estado inválido en feature {f['id']}: {f['status']}")
                      sys.exit(1)
              print(f"[OK] feature_list.json válido ({len(data['features'])} features, {len(in_progress)} en progreso)")
          except Exception as e:
              print(f"[FAIL] feature_list.json inválido: {e}")
              sys.exit(1)
          PY

      - name: Check generated OpenAPI contract drift
        run: python3 scripts/check_openapi_drift.py

  typescript:
    name: TypeScript (Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # La versión sale de packageManager en package.json; no fijar aquí
        # para que no diverja (OC-002).

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm@11 (packageManager) requiere Node >= 22.13; Node 20 lo crashea.
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

  organization-browser:
    name: Organization Browser Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run mocked organization switch gate
        run: pnpm exec playwright test --config=playwright.config.ts tests/smoke/organization-switch.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real organization browser gate
        run: pnpm test:organization:browser

  sketchup-extension:
    name: SketchUp Extension (Ruby, ${{ matrix.os }})
    # Documented runtime targets are macOS and Windows; run the portable
    # Ruby/RBZ gates on all three families. Licensed SketchUp host smoke
    # remains a separate manual gate (README §Evidencia).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/sketchup-extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.11'
          bundler: Gemfile.lock
          bundler-cache: true
          working-directory: apps/sketchup-extension

      - name: Verify extension and RBZ package
        run: bundle exec rake verify

  backend-go:
    name: Go Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Sin esto, los tests de integración de storage se saltan con t.Skip
      # y la CI da un verde falso (OC-002). Los propios tests aplican las
      # migraciones embebidas sobre la base fresca.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum

      # F179: la suite de Pilot Readiness (tests/pilotreadiness) corre dentro
      # de `go test ./...` y su pata de backup/restore necesita pg_dump/
      # pg_restore (misma major que el service container postgres:16).
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run Go Tests
        working-directory: backend-go
        # PostgreSQL migration/race suites share cluster-level role DDL; keep
        # package execution serial so independent ephemeral DB fixtures cannot
        # concurrently mutate pg_auth_members.
        run: go test -p 1 -v ./...
