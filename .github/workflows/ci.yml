name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Select verification impact
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify exact tested merge tree (unknown means full)
        id: impact
        run: python3 scripts/ci_impact.py --ci

  validate-catalog:
    name: Validate Product Capability Catalog & Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate feature_list.json
        run: python3 scripts/validate_feature_catalog.py
      - name: Check generated OpenAPI contract drift
        run: python3 scripts/check_openapi_drift.py
      - name: Verify CI selection, fail-closed gate and factory contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_*.py' -v
          python3 -m unittest discover -s scripts -p test_factory_efficiency.py -v
          python3 -m unittest discover -s scripts -p test_factory_workflow_contract.py -v

  typescript:
    name: TypeScript (Typecheck & Tests)
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs.typescript }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  proyectar-visual:
    name: Proyectar WebGL visual gate (#444)
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['proyectar-visual'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Same deterministic Chromium/SwiftShader baseline, no weakened tests.
      - run: pnpm exec playwright test --config=playwright.config.ts tests/visual/proyectar-webgl.spec.ts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proyectar-visual-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  foundation-postgres:
    name: Foundation PostgreSQL proofs
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['foundation-postgres'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run unchanged deployment/RLS/fresh/upgrade/atomic/pilot proofs
        run: scripts/foundation-gate-a.sh --stage postgres

  organization-browser:
    name: Foundation real browser proofs
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['organization-browser'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Full real-browser suite and isolated runtime-role PostgreSQL, not mocks.
      - run: scripts/foundation-gate-a.sh --stage browser

  sketchup-extension:
    name: SketchUp Extension (Ruby, ${{ matrix.os }})
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['sketchup-extension'] }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/sketchup-extension
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.11'
          bundler: Gemfile.lock
          bundler-cache: true
          working-directory: apps/sketchup-extension
      - name: Verify extension and RBZ package
        run: bundle exec rake verify

  storage-shard-plan:
    name: Storage shard coverage plan
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['backend-go'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - name: Prove AST discovery covers exactly three non-empty storage shards
        working-directory: backend-go
        run: |
          mkdir -p ../.ci-storage-shards
          go run ./cmd/testshard discover -package ./internal/storage -format names > ../.ci-storage-shards/all-roots
          for shard in 1 2 3; do
            go run ./cmd/testshard shard -package ./internal/storage -count 3 -index "$shard" -strategy lpt \
              -timings testdata/storage-before-81a7896.timings -format names > "../.ci-storage-shards/shard-$shard-roots"
          done
          python3 ../scripts/verify_storage_shard_plan.py --expected-count 509 \
            --all ../.ci-storage-shards/all-roots \
            --shard ../.ci-storage-shards/shard-1-roots \
            --shard ../.ci-storage-shards/shard-2-roots \
            --shard ../.ci-storage-shards/shard-3-roots

  storage-shards:
    name: Storage shard ${{ matrix.shard }}/3
    needs: [impact, storage-shard-plan]
    if: ${{ needs.impact.result == 'success' && needs.storage-shard-plan.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['backend-go'] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - name: Record storage shard start
        run: |
          printf 'storage shard %s/3 started=%s\n' "${{ matrix.shard }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run isolated AST-selected storage shard
        run: scripts/backend-test-storage-shard.sh 3 "${{ matrix.shard }}" lpt backend-go/testdata/storage-before-81a7896.timings

  backend-go-other:
    name: Go Backend Tests (excluding storage)
    needs: impact
    if: ${{ needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['backend-go'] }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - name: Run all other Go packages through the isolated canonical runner
        run: |
          mapfile -t packages < <(cd backend-go && go list ./... | grep -Fvx 'github.com/tiagofur/muebles-backend/internal/storage')
          test "${#packages[@]}" -gt 0
          scripts/backend-test.sh -timeout=30m -v "${packages[@]}"

  backend-go:
    # Preserve the branch-protection check identity while requiring the plan,
    # every matrix entry, and the unsharded non-storage backend packages.
    name: Go Backend Tests
    needs: [impact, storage-shard-plan, storage-shards, backend-go-other]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every selected storage shard and other backend package proof
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_backend_go_result.py

  foundation-gate-a:
    # Preserve the existing check name as the stable aggregate; all expected
    # jobs must succeed. Publication metadata remains a separate required gate.
    name: Foundation Gate A
    needs: [impact, validate-catalog, typescript, proyectar-visual, sketchup-extension, backend-go, foundation-postgres, organization-browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every selected proof for the exact tested commit
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_result.py
