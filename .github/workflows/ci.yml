name: CI

on:
  workflow_dispatch:
    inputs:
      ptx_target:
        description: 'Temporary #839 PTX laboratory target'
        required: true
        default: candidate
        type: choice
        options: [candidate, base]
      ptx_browser_env:
        description: 'Candidate Playwright/Vite child environment A/B only'
        required: true
        default: isolated
        type: choice
        options: [isolated, inherited-safe]
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ptx-diagnostic:
    name: Temporary #839 PTX prefix only
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/839-ptx-diagnostic' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact laboratory branch and prepare exact-base comparator
        env:
          PTX_TARGET: ${{ inputs.ptx_target }}
          PTX_DIAGNOSTIC_BROWSER_ENV: ${{ inputs.ptx_browser_env }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/codex/839-ptx-diagnostic'
          git merge-base --is-ancestor 24b014906e4fdd0963d4017df4865fc6527d9bca HEAD
          case "${PTX_DIAGNOSTIC_BROWSER_ENV}" in
            isolated) ;;
            inherited-safe) test "${PTX_TARGET}" = candidate ;;
            *) exit 2 ;;
          esac
          case "${PTX_TARGET}" in
            candidate) ;;
            base)
              git diff --binary 24b014906e4fdd0963d4017df4865fc6527d9bca..HEAD -- \
                apps/web/src/AppContent.tsx \
                apps/web/src/exportCutPlanPtx.ts \
                apps/web/src/exportOptimizer.ts \
                apps/web/src/exports/useExportHandlers.ts \
                packages/ui/src/production/ProductionOrderOptimizationPanel.tsx \
                tests/organization/engineering-state.spec.ts > "${RUNNER_TEMP}/ptx-overlay.patch"
              cp scripts/ptx-diagnostic-launcher.py "${RUNNER_TEMP}/ptx-diagnostic-launcher.py"
              cp scripts/ptx-diagnostic-sanitize.py "${RUNNER_TEMP}/ptx-diagnostic-sanitize.py"
              git checkout --detach 6184b4d2d36c5c73e3fbcabde2c2785e5335e565
              git apply --check "${RUNNER_TEMP}/ptx-overlay.patch"
              git apply "${RUNNER_TEMP}/ptx-overlay.patch"
              cp "${RUNNER_TEMP}/ptx-diagnostic-launcher.py" scripts/
              cp "${RUNNER_TEMP}/ptx-diagnostic-sanitize.py" scripts/
              python3 scripts/ptx-diagnostic-launcher.py scripts/organization-browser-gate.sh
              ;;
            *) exit 2 ;;
          esac
          bash -n scripts/organization-browser-gate.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Record technical runner metadata only
        env:
          PTX_TARGET: ${{ inputs.ptx_target }}
          PTX_DIAGNOSTIC_BROWSER_ENV: ${{ inputs.ptx_browser_env }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ptx-diagnostic/safe" "${RUNNER_TEMP}/ptx-diagnostic/raw"
          test "$(uname -m)" = x86_64
          docker pull postgres:16-alpine >/dev/null
          {
            uname -a
            cat /etc/os-release
            printf 'architecture=%s\n' "$(uname -m)"
            printf 'runner_image_os=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'target=%s\nsource_sha=%s\ndiagnostic_branch_sha=%s\nbrowser_env_variant=%s\n' "${PTX_TARGET}" "$(git rev-parse HEAD)" "${GITHUB_SHA}" "${PTX_DIAGNOSTIC_BROWSER_ENV}"
            node --version
            go version
            pnpm --version
            pnpm exec playwright --version
            node -e "const {chromium}=require('@playwright/test'); require('node:child_process').execFileSync(chromium.executablePath(), ['--version'], {stdio:'inherit'})"
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}}'
            docker image inspect postgres:16-alpine --format 'postgres_digest={{index .RepoDigests 0}}'
            printf 'cpu_count=%s\n' "$(nproc)"
            free -h
            df -h .
          } > "${RUNNER_TEMP}/ptx-diagnostic/safe/runner-metadata.txt"
      - name: Run exact first 32 tests through PTX with real disposable launcher
        id: prefix
        env:
          PTX_DIAGNOSTIC_DIR: ${{ runner.temp }}/ptx-diagnostic/raw
          PTX_DIAGNOSTIC_BROWSER_ENV: ${{ inputs.ptx_browser_env }}
        run: |
          set +e
          scripts/organization-browser-gate.sh \
            tests/organization/bootstrap.spec.ts \
            tests/organization/demo-flow-happy-path.spec.ts \
            tests/organization/demo-golden-path.spec.ts \
            tests/organization/design-working-materials-reconcile.spec.ts \
            tests/organization/engineering-cutting-demand.spec.ts \
            tests/organization/engineering-entry.spec.ts \
            tests/organization/engineering-physical-gate.spec.ts \
            tests/organization/engineering-state.spec.ts \
            --grep-invert 'Completar Ingeniería → Completa final' \
            --workers=1 > "${PTX_DIAGNOSTIC_DIR}/launcher.log" 2>&1
          result=$?
          printf '%s\n' "${result}" > "${RUNNER_TEMP}/ptx-diagnostic/launcher-exit"
          exit 0
      - name: Preserve allowlisted failure context without raw errors
        if: always()
        env:
          PTX_TARGET: ${{ inputs.ptx_target }}
        run: |
          result="$(cat "${RUNNER_TEMP}/ptx-diagnostic/launcher-exit" 2>/dev/null || printf '125')"
          python3 scripts/ptx-diagnostic-sanitize.py \
            --raw "${RUNNER_TEMP}/ptx-diagnostic/raw" \
            --output "${RUNNER_TEMP}/ptx-diagnostic/safe" \
            --status "${result}" \
            --target "${PTX_TARGET}" --context-only
      - name: Privacy-screen PTX artifacts
        id: sanitize
        env:
          PTX_TARGET: ${{ inputs.ptx_target }}
        run: |
          python3 scripts/ptx-diagnostic-sanitize.py \
            --raw "${RUNNER_TEMP}/ptx-diagnostic/raw" \
            --output "${RUNNER_TEMP}/ptx-diagnostic/safe" \
            --status "$(cat "${RUNNER_TEMP}/ptx-diagnostic/launcher-exit")" \
            --target "${PTX_TARGET}"
      - name: Upload safe technical metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptx-runner-metadata
          path: |
            ${{ runner.temp }}/ptx-diagnostic/safe/runner-metadata.txt
            ${{ runner.temp }}/ptx-diagnostic/safe/sanitized-failure-context.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload privacy-screened PTX evidence
        if: ${{ steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ptx-diagnostic-evidence
          path: |
            ${{ runner.temp }}/ptx-diagnostic/safe/ptx-events.json
            ${{ runner.temp }}/ptx-diagnostic/safe/ptx-trace-sanitized.zip
            ${{ runner.temp }}/ptx-diagnostic/safe/ptx-screenshot.png
            ${{ runner.temp }}/ptx-diagnostic/safe/sanitized-log.txt
            ${{ runner.temp }}/ptx-diagnostic/safe/sanitized-failure-context.txt
          if-no-files-found: error
          retention-days: 3
      - name: Preserve prefix outcome
        if: ${{ steps.sanitize.outcome == 'success' }}
        run: exit "$(cat "${RUNNER_TEMP}/ptx-diagnostic/launcher-exit")"

  impact:
    name: Select verification impact
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Classify exact tested merge tree (unknown means full)
        id: impact
        run: python3 scripts/ci_impact.py --ci

  validate-catalog:
    name: Validate Product Capability Catalog & Harness
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate feature_list.json
        run: python3 scripts/validate_feature_catalog.py
      - name: Check generated OpenAPI contract drift
        run: python3 scripts/check_openapi_drift.py
      - name: Verify CI selection, fail-closed gate and factory contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_*.py' -v
          python3 -m unittest discover -s scripts -p test_factory_efficiency.py -v
          python3 -m unittest discover -s scripts -p test_factory_workflow_contract.py -v

  typescript:
    name: TypeScript (Typecheck & Tests)
    needs: impact
    if: ${{ github.event_name != 'workflow_dispatch' && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs.typescript }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  proyectar-visual:
    name: Proyectar WebGL visual gate (#444)
    needs: impact
    if: ${{ github.event_name != 'workflow_dispatch' && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['proyectar-visual'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Same deterministic Chromium/SwiftShader baseline, no weakened tests.
      - run: pnpm exec playwright test --config=playwright.config.ts tests/visual/proyectar-webgl.spec.ts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proyectar-visual-failure-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  foundation-postgres:
    name: Foundation PostgreSQL proofs
    needs: impact
    if: ${{ github.event_name != 'workflow_dispatch' && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['foundation-postgres'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run unchanged deployment/RLS/fresh/upgrade/atomic/pilot proofs
        run: scripts/foundation-gate-a.sh --stage postgres

  organization-browser:
    name: Foundation real browser proofs
    needs: impact
    if: ${{ github.event_name != 'workflow_dispatch' && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['organization-browser'] }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Full real-browser suite and isolated runtime-role PostgreSQL, not mocks.
      - run: scripts/foundation-gate-a.sh --stage browser

  sketchup-extension:
    name: SketchUp Extension (Ruby, ${{ matrix.os }})
    needs: impact
    if: ${{ github.event_name != 'workflow_dispatch' && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['sketchup-extension'] }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/sketchup-extension
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.11'
          bundler: Gemfile.lock
          bundler-cache: true
          working-directory: apps/sketchup-extension
      - name: Verify extension and RBZ package
        run: bundle exec rake verify

  backend-go:
    name: Go Backend Tests
    needs: impact
    if: ${{ github.event_name != 'workflow_dispatch' && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).jobs['backend-go'] }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: granete_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d granete_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/granete_test?sslmode=disable
      GRANETE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend-go/go.sum
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Run Go Tests
        working-directory: backend-go
        # Keep serialization: cluster-level role DDL shares pg_auth_members.
        # Keep the existing per-package timeout, not a fast-but-incomplete suite.
        run: go test -p 1 -timeout=30m -v ./...

  foundation-gate-a:
    # Preserve the existing check name as the stable aggregate; all expected
    # jobs must succeed. Publication metadata remains a separate required gate.
    name: Foundation Gate A
    needs: [impact, validate-catalog, typescript, proyectar-visual, sketchup-extension, backend-go, foundation-postgres, organization-browser]
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require every selected proof for the exact tested commit
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_result.py
