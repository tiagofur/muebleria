name: granete-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: granete-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-granete_prod}
      # Required: compose refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-granete_prod}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/010-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-granete_prod} -d ${POSTGRES_DB:-granete_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal_net

  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: granete-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgres://granete_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-granete_prod}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-granete_prod}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-granete_prod}?sslmode=disable
      # Required: compose refuses to start without it.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER must be set in .env}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?MEDIA_SIGNING_KEY must be set in .env}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?MFA_ENCRYPTION_KEYS must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      # #460 SEC-4A: production is pinned (not overridable via .env) so the
      # Web refresh cookie can never resolve to Secure=false here — a
      # WEB_REFRESH_COOKIE_SECURE=false in the environment makes the backend
      # refuse to boot instead of shipping an insecure credential.
      GRANETE_ENV: production
      MEDIA_DIR: /data/media
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-0.5}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - internal_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: granete-web
    restart: unless-stopped
    volumes:
      - web_dist:/srv
    networks:
      - internal_net

  caddy:
    image: caddy:2.8-alpine
    container_name: granete-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal_net
      - public_net

volumes:
  postgres_data:
    name: granete_postgres_data
  media_data:
    name: granete_media_data
  web_dist:
    name: granete_web_dist
  caddy_data:
    name: granete_caddy_data
  caddy_config:
    name: granete_caddy_config

networks:
  internal_net:
    internal: true
  public_net:
    driver: bridge
